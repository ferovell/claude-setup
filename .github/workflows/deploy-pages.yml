name: Deploy birthday card to GitHub Pages

on:
  push:
    branches: [claude/birthday-gift-card-interactive-cgrdmn]
    paths:
      - "birthday-card/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: birthday-card

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
